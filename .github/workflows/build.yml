name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            cmake_args: ""
          - name: macOS
            os: macos-14
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgtk-3-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/WavethingsTests_artefacts/Release/WavethingsTests.exe "$RUNNER_TEMP/wt-tests"
          else
            ./build/WavethingsTests_artefacts/Release/WavethingsTests "$RUNNER_TEMP/wt-tests"
          fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/WavethingsAutosampler
          cp "build/WavethingsAutosampler_artefacts/Release/Wavethings Autosampler" dist/WavethingsAutosampler/
          cp README.md LICENSE dist/WavethingsAutosampler/
          tar -czf WavethingsAutosampler-${{ github.ref_name }}-linux-x64.tar.gz -C dist WavethingsAutosampler

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="build/WavethingsAutosampler_artefacts/Release/Wavethings Autosampler.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" WavethingsAutosampler-${{ github.ref_name }}-macos-universal.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/WavethingsAutosampler | Out-Null
          Copy-Item "build/WavethingsAutosampler_artefacts/Release/Wavethings Autosampler.exe" dist/WavethingsAutosampler/
          Copy-Item README.md, LICENSE dist/WavethingsAutosampler/
          Compress-Archive -Path dist/WavethingsAutosampler -DestinationPath "WavethingsAutosampler-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WavethingsAutosampler-${{ matrix.name }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Wavethings Autosampler ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: artifacts/*
